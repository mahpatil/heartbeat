[package]
name = "heartbeat"
version = "0.6.0"
edition = "2024"
description = "A lightweight daemon that runs agent/shell tasks from prompt markup job files"

[[bin]]
name = "heartbeat"
path = "src/main.rs"

[dependencies]
# Async runtime (full for signal handling + process + net)
tokio = { version = "1", features = ["full"] }
# Serialisation
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# CLI (Milestone 2 — declared now so it compiles)
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Config / env
dotenvy = "0.15"
# Time
chrono = { version = "0.4", features = ["serde"] }
# Filesystem watching (hot-reload)
notify = "6"
# Error handling
anyhow = "1"
# HTTP checks (url-check step)
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# Human-readable duration parsing (e.g. "10m", "30s")
humantime = "2"
# ~ expansion
shellexpand = "3"
# Binary lookup
which = "6"
# Interactive prompts for `new` wizard
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
# Natural-language parsing for `build` command
regex = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
