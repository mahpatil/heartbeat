name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cache Cargo registry + build artefacts
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/heartbeat

      - name: Package and checksum
        run: |
          ASSET="heartbeat-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/heartbeat" "$ASSET"
          shasum -a 256 "$ASSET" | awk '{print $1}' > "$ASSET.sha256"
          echo "Asset size: $(wc -c < "$ASSET") bytes"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            heartbeat-${{ matrix.target }}
            heartbeat-${{ matrix.target }}.sha256
          generate_release_notes: true
